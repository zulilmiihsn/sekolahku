<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Aurora Background - Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#005A9C',
                        accent: '#00C49A',
                    },
                    keyframes: {
                        'aurora': {
                            '0%': { transform: 'scale(1) translateY(0) rotate(0deg)' },
                            '50%': { transform: 'scale(1.1) translateY(-20px) rotate(8deg)' },
                            '100%': { transform: 'scale(1) translateY(0) rotate(0deg)' },
                        },
                        'aurora2': {
                            '0%': { transform: 'scale(1) translateX(0) rotate(0deg)' },
                            '50%': { transform: 'scale(1.08) translateX(30px) rotate(-6deg)' },
                            '100%': { transform: 'scale(1) translateX(0) rotate(0deg)' },
                        },
                    },
                    animation: {
                        'aurora': 'aurora 8s ease-in-out infinite',
                        'aurora2': 'aurora2 10s ease-in-out infinite',
                    },
                }
            }
        }
    </script>
    <style>
        .aurora-test {
            background: linear-gradient(to top right, #005A9C, #00C49A, #c084fc);
        }
        .aurora-test2 {
            background: linear-gradient(to top right, #00C49A, #005A9C, #93c5fd);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="relative flex items-center justify-center min-h-screen overflow-hidden">
        <!-- Aurora Gradient - Exact copy from our component -->
        <div
            aria-hidden="true"
            class="absolute inset-0 -z-10"
            style="z-index:-1"
        >
            <div 
                class="absolute left-1/2 top-1/3 w-[400px] h-[250px] -translate-x-1/2 rounded-full blur-3xl opacity-60 animate-aurora aurora-test" 
                style="z-index:-1"
            />
            <div 
                class="absolute right-1/4 top-1/2 w-[200px] h-[120px] rounded-full blur-2xl opacity-40 animate-aurora2 aurora-test2" 
                style="z-index:-1"
            />
        </div>
        
        <div class="text-center">
            <h1 class="text-6xl font-bold text-primary mb-4">Aurora Background Test</h1>
            <p class="text-xl text-gray-700 mb-4">Jika Anda melihat background berwarna-warni yang bergerak, aurora berfungsi!</p>
            <div class="text-sm text-gray-500">
                <p>✅ Inline styles: linear-gradient</p>
                <p>✅ z-index: -1</p>
                <p>✅ animate-aurora classes</p>
                <p>✅ blur-3xl dan blur-2xl</p>
            </div>
        </div>
    </div>
</body>
</html>
