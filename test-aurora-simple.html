<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Aurora Background</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#005A9C',
                        accent: '#00C49A',
                    },
                    keyframes: {
                        'aurora': {
                            '0%': { transform: 'scale(1) translateY(0) rotate(0deg)' },
                            '50%': { transform: 'scale(1.1) translateY(-20px) rotate(8deg)' },
                            '100%': { transform: 'scale(1) translateY(0) rotate(0deg)' },
                        },
                        'aurora2': {
                            '0%': { transform: 'scale(1) translateX(0) rotate(0deg)' },
                            '50%': { transform: 'scale(1.08) translateX(30px) rotate(-6deg)' },
                            '100%': { transform: 'scale(1) translateX(0) rotate(0deg)' },
                        },
                    },
                    animation: {
                        'aurora': 'aurora 8s ease-in-out infinite',
                        'aurora2': 'aurora2 10s ease-in-out infinite',
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="relative flex items-center justify-center min-h-screen overflow-hidden">
        <!-- Aurora Gradient -->
        <div class="absolute inset-0 -z-10">
            <div class="absolute left-1/2 top-1/3 w-[400px] h-[250px] -translate-x-1/2 rounded-full blur-3xl opacity-60 bg-gradient-to-tr from-primary via-accent to-purple-400 animate-aurora"></div>
            <div class="absolute right-1/4 top-1/2 w-[200px] h-[120px] rounded-full blur-2xl opacity-40 bg-gradient-to-tr from-accent via-primary to-blue-300 animate-aurora2"></div>
        </div>
        
        <div class="text-center">
            <h1 class="text-6xl font-bold text-primary mb-4">Test Aurora</h1>
            <p class="text-xl text-gray-700">Jika Anda melihat background berwarna-warni yang bergerak, aurora berfungsi!</p>
        </div>
    </div>
</body>
</html>
